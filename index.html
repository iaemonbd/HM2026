  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    /* ══════════════════════════════════════════════════════
       VARIABLES & BASE
       ══════════════════════════════════════════════════════ */
    :root {
      /* ✅ FIX 21: রেফারেন্স অনুযায়ী Light mode কালার আপডেট */
      --bg:            #f5f7fc;
      --bg-alt:        #ffffff;
      --bg-card:       #ffffff;
      --gold:          #C49A1B;
      --gold-light:    #E6B422;
      --gold-dim:      rgba(196,154,27,0.12);
      --white:         #1e2a3a;
      --text:          #2c3e50;
      --muted:         #5a6e7c;
      --border:        rgba(196,154,27,0.35);
      --border-subtle: rgba(0,0,0,0.08);
      --font-display:  'Cormorant Garamond', serif;
      --font-body:     'DM Sans', sans-serif;
      --ease:          cubic-bezier(0.25, 1, 0.5, 1);
      /* ✅ ব্যাকগ্রাউন্ড অ্যানিমেশনের জন্য সামান্য translucent সেকশন ব্যাকগ্রাউন্ড */
      --bg-translucent: rgba(245,247,252,0.94);
    }
    body.night {
      /* ✅ ডার্ক নেভি ব্লু — পরিষ্কার, অ্যানিমেশন নেই */
      --bg:            #0a1628;
      --bg-alt:        #0d1b2a;
      --bg-card:       #132038;
      --gold:          #e6b800;
      --gold-light:    #ffd633;
      --gold-dim:      rgba(230,184,0,0.18);
      --white:         #e0e4ed;
      --text:          #b0b8d0;
      --muted:         #6c758f;
      --border:        rgba(230,184,0,0.38);
      --border-subtle: rgba(255,255,255,0.05);
      /* ✅ ব্যাকগ্রাউন্ড অ্যানিমেশনের জন্য সামান্য translucent সেকশন ব্যাকগ্রাউন্ড */
      --bg-translucent: rgba(10,22,40,0.94);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    /* ══ ব্যাকগ্রাউন্ড — CSS variable দিয়ে Day/Night mode অনুযায়ী dynamic ══ */
    #global-bg {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: -2; pointer-events: none;
      background-color: var(--bg-alt);
    }
    #global-bg .g-blob { display: none; }
    #bgAnimationCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    body {
      font-family: var(--font-body);
      background: var(--bg-alt);
      color: var(--text);
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ══════════════════════════════════════════════════════
       SCROLLBAR & CURSOR
       ══════════════════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(196,154,27,0.4); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

    /* ══════════════════════════════════════════════════════
       SECTION BACKGROUNDS — Day/Night mode অনুযায়ী dynamic
       ══════════════════════════════════════════════════════ */
    section,
    .marquee-section, .process-section, .products-section,
    .features-section, .strength-section, .machinery-section,
    .team-section, .sus-section, .contact-section, footer {
      background: var(--bg-translucent) !important;
    }
    /* Thin divider lines */
    .marquee-section   { border-top:    1px solid var(--border-subtle) !important;
                         border-bottom: 1px solid var(--border-subtle) !important; }
    .process-section,
    .products-section,
    .strength-section,
    .machinery-section,
    .sus-section       { border-top: 1px solid var(--border-subtle) !important; }
    footer             { border-top: 1px solid var(--border) !important; }

    /* Glass surface for cards */
    .stat-box, .process-step, .prod-card, .feature-card,
    .strength-box, .team-card, .sus-card, .contact-card,
    .admin-form-card, .admin-list-item, .table-wrap, .map-card,
    .bh-row {
      background: var(--bg-card) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    body.night::before { display: none; }
    .cursor, .cursor-follower { display: none; }
    @media (pointer:fine) { .cursor, .cursor-follower { display: block; } }
    .cursor {
      width: 8px; height: 8px; background: var(--gold); border-radius: 50%;
      position: fixed; pointer-events: none; z-index: 99999;
      transform: translate(-50%,-50%); transition: width .15s, height .15s;
    }
    .cursor-follower {
      width: 36px; height: 36px; border: 1px solid rgba(196,154,27,0.5);
      border-radius: 50%; position: fixed; pointer-events: none; z-index: 99998;
      transform: translate(-50%,-50%); transition: transform 0.12s var(--ease), width .3s, height .3s;
    }
    body:has(a:hover) .cursor { width: 14px; height: 14px; background: var(--gold-light); }
    body:has(a:hover) .cursor-follower { width: 56px; height: 56px; border-color: var(--gold); }

    .night-toggle {
      position: fixed; bottom: 100px; right: 30px; z-index: 1001;
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--bg-card); border: 1px solid var(--gold); color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.5rem; backdrop-filter: blur(8px);
      transition: all 0.3s var(--ease); box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .night-toggle:hover { transform: scale(1.1); background: var(--gold); color: #000; }

    /* ══════════════════════════════════════════════════════
       HEADER & NAVIGATION
       ══════════════════════════════════════════════════════ */
    header {
      position: fixed; top:0; left:0; right:0; z-index: 1000;
      padding: 18px 0; transition: padding .4s, background .4s;
    }
    header::before {
      content:""; position: absolute; inset:0;
      background: rgba(255,255,255,0); backdrop-filter: blur(0px);
      transition: background .5s, backdrop-filter .5s; z-index: -1;
    }
    header.scrolled::before {
      background: rgba(238,241,248,0.88); backdrop-filter: blur(22px);
      border-bottom: 1px solid rgba(196,154,27,0.12);
    }
    body.night header.scrolled::before { background: rgba(3,5,10,0.90); border-bottom-color: rgba(255,255,255,0.05); }
    .nav-container {
      max-width: 1280px; margin: 0 auto; padding: 0 40px;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .nav-links { display: flex; align-items: center; gap: 40px; list-style: none; }
    .nav-links a {
      font-size: 0.75rem; font-weight: 500; color: var(--muted);
      text-transform: uppercase; letter-spacing: 2.5px; position: relative; padding-bottom: 4px;
      transition: color .3s; text-decoration: none; white-space: nowrap;
    }
    .nav-links a::after {
      content:''; position: absolute; bottom: 0; left: 50%; width: 0; height: 1px;
      background: var(--gold); transition: width .4s var(--ease), left .4s var(--ease);
    }
    .nav-links a:hover { color: var(--gold); }
    .nav-links a:hover::after { width: 100%; left: 0; }
    .mobile-toggle {
      display: none; position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      font-size: 1.3rem; cursor: pointer; color: var(--gold); background: none; border: none;
    }

    /* ══════════════════════════════════════════════════════
       LAYOUT & TYPOGRAPHY
       ══════════════════════════════════════════════════════ */
    .container { max-width: 1280px; margin: 0 auto; padding: 0 40px; }
    .section-padding { padding: 110px 0; }
    .eyebrow {
      display: block; text-align: center; font-family: var(--font-body);
      font-size: 0.75rem; font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 16px; position: relative;
    }
    .eyebrow::before {
      content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
      width:0; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent);
      animation:eyeGlow 3s ease-in-out infinite;
    }
    @keyframes eyeGlow {
      0%,100%{width:0;opacity:.3;} 50%{width:80px;opacity:1;}
    }
    h2 {
      font-family: var(--font-display); font-size: 3.8rem; font-weight: 300;
      text-align: center; line-height: 1.1; margin-bottom: 60px; color: var(--white);
    }
    h2 em { font-style: italic; color: var(--gold); }
    h2 .line { display: block; width: 40px; height: 1px; background: var(--gold); margin: 20px auto 0; }
    p { color: var(--text); font-weight: 400; font-size: 1.05rem; line-height: 1.85; margin-bottom: 1.2rem; }

    /* Print protection */
    @media print { html,body { display:none!important; visibility:hidden!important; } }
    body { -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none; }
  </style>

  <!-- ✅ FRONT-END SECURITY SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Disable Right-Click
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Disable Drag and Drop for images
      document.addEventListener('dragstart', event => event.preventDefault());

      // Block Developer Tools shortcuts
      document.addEventListener('keydown', event => {
        if (
          event.keyCode === 123 || // F12
          (event.ctrlKey && event.shiftKey && (event.keyCode === 73 || event.keyCode === 74 || event.keyCode === 67)) || // Ctrl+Shift+I / J / C
          (event.ctrlKey && event.keyCode === 85) // Ctrl+U
        ) {
          event.preventDefault();
        }
      });
    });
  </script>
</head>

<div class="scroll-progress" id="scrollProgress"></div>

<div class="cursor-follower" id="follower"></div>
