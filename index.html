     আসল ভিজিটরদের জন্য পুরো পেজ ব্লক করে দিচ্ছিল ("Access Restricted")।
     তাই এই ফিচারটা সম্পূর্ণ সরিয়ে ফেলা হলো — বাকি সুরক্ষাগুলো
     (right-click/select/drag বন্ধ, F12/Ctrl+U/Ctrl+S/Ctrl+Shift+I
     ব্লক, print বন্ধ) অপরিবর্তিত আছে। */

  /* ---- Prevent normal print/save-to-PDF output ---- */
  const _printCss=document.createElement("style");
  _printCss.textContent="@media print{html,body{display:none!important;visibility:hidden!important}}";
  document.documentElement.appendChild(_printCss);

  /* ---- Runtime DOM injection ---- */
  const _render=()=>{
    const html=_decode();
    document.open();
    document.write(html);
    document.close();
  };

  /* Delay only the initial source reconstruction; after that the
     original HTML/CSS/JS runs unchanged. */
  if(document.readyState==="loading") _render();
  else setTimeout(_render,0);
})();
</script>
